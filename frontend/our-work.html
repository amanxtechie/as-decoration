<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Work — Real Event Setups | AS Decoration, Bihar</title>
  <meta name="description" content="Completed wedding, birthday, anniversary and corporate decoration projects by AS Decoration across Nalanda, Sheikhpura, Nawada and Lakhisarai." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2a1040" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-head">
      <div class="container">
        <p class="breadcrumbs"><a href="/index.html">Home</a> / Our Work</p>
        <h1>Our work</h1>
        <p>Real setups we've completed across the four districts we serve. Tap any photo to view it larger.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <select id="fCategory" aria-label="Filter by category"><option value="">All occasions</option></select>
          <select id="fTown" aria-label="Filter by town"><option value="">All towns</option></select>
          <span class="filter-bar__count" id="count"></span>
        </div>
        <div class="gallery-grid" id="grid">
          <div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div>
          <div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div>
        </div>
      </div>
    </section>

    <section class="section section--alt" id="videos" hidden>
      <div class="container">
        <div class="section-head section-head--center">
          <span class="eyebrow">Watch</span>
          <h2>Video walkthroughs</h2>
        </div>
        <div class="video-grid" id="videoGrid"></div>
      </div>
    </section>

    <section class="cta-band">
      <div class="container">
        <h2>Like what you see?</h2>
        <p>Tell us your date and venue and we'll suggest something in the same style.</p>
        <a href="/contact.html" class="btn btn--gold">Send an enquiry</a>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/location.js"></script>
  <script src="/assets/js/whatsapp.js"></script>
  <script src="/assets/js/saved.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/work-page.js"></script>
